name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A push made with GITHUB_TOKEN (the records job committing records.json)
  # deliberately does not trigger workflows, so deploy off that run finishing
  # instead — otherwise fresh records land in the repo but never on the site.
  workflow_run:
    workflows: ["Update NFL records"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it isn't already, instead of
          # failing with "Get Pages site failed".
          enablement: true
      # GitHub Pages serves with max-age=600, so a phone can hold a stale
      # copy for ten minutes — and a Home Screen app has no reload button
      # at all. Stamp the build into the page, publish it as version.txt
      # for the running app to compare against, and version the asset URLs
      # so fresh HTML can never pair with cached JS or CSS.
      - name: Stamp the build
        run: |
          SHA="${GITHUB_SHA:0:8}"
          printf '%s' "$SHA" > version.txt
          sed -i             -e "s|<meta name=\"build\" content=\"dev\">|<meta name=\"build\" content=\"$SHA\">|"             -e "s|href=\"styles.css\"|href=\"styles.css?v=$SHA\"|"             -e "s|src=\"teams.js\"|src=\"teams.js?v=$SHA\"|"             -e "s|src=\"records-parse.js\"|src=\"records-parse.js?v=$SHA\"|"             -e "s|src=\"app.js\"|src=\"app.js?v=$SHA\"|"             index.html
          echo "build $SHA"
          grep -E 'meta name="build"|styles.css|app.js' index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
