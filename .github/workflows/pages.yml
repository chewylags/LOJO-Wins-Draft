name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A push made with GITHUB_TOKEN (the records job committing records.json)
  # deliberately does not trigger workflows, so deploy off that run finishing
  # instead — otherwise fresh records land in the repo but never on the site.
  workflow_run:
    workflows: ["Update NFL records"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it isn't already, instead of
          # failing with "Get Pages site failed".
          enablement: true

      # Writes version.txt and versions the asset URLs, so a phone holding a
      # cached copy can tell it is out of date and fetch the new one.
      - name: Stamp the build
        run: node scripts/stamp-build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
