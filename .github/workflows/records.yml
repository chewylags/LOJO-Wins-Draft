name: Update NFL records

on:
  schedule:
    # 11:15 UTC daily — after Sunday and Monday night games have finished.
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current records
        run: node scripts/fetch-records.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- records.json; then
            echo "No record changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.json
          git commit -m "Update NFL records"
          git push
