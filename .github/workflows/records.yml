name: Update NFL records

on:
  schedule:
    # Times are UTC. The windows cover live game slates so the published
    # file stays close to current even for someone who never presses
    # Update now; the daily run is the catch-all.
    - cron: '15 11 * * *'        # every morning, after everything has settled
    - cron: '*/30 17-23 * * 0'   # Sunday, early through late afternoon windows
    - cron: '*/30 0-5 * * 1'     # Sunday night football, into Monday UTC
    - cron: '*/30 0-5 * * 2'     # Monday night football
    - cron: '*/30 0-5 * * 5'     # Thursday night football
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current records
        run: node scripts/fetch-records.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- records.json; then
            echo "No record changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.json
          git commit -m "Update NFL records"
          git push
