name: CORS check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Do ESPN endpoints allow browser requests?
        run: |
          for u in \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/standings" \
            "https://site.web.api.espn.com/apis/v2/sports/football/nfl/standings?region=us&lang=en&contentorigin=espn&type=0&level=1" \
            "https://cdn.espn.com/core/nfl/standings?xhr=1" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" ; do
            echo "=== $u"
            curl -s -D - -o /dev/null \
              -H "Origin: https://chewylags.github.io" \
              "$u" | grep -iE '^(HTTP/|access-control-|vary:)' || echo "   (no CORS headers present)"
            echo
          done
